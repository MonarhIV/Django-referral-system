<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка авторизации (SPA)</title>
    <style>
        body { font-family: sans-serif; }
        .msg { margin: 10px 0; }
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>Авторизация по номеру телефона</h1>
    <div id="app">
        <div id="step1">
            <input type="text" id="phone" placeholder="Телефон" required>
            <button onclick="sendPhone()">Получить код</button>
        </div>
        <div id="step2" style="display:none;">
            <input type="text" id="code" placeholder="Код из SMS" required>
            <button onclick="sendCode()">Войти</button>
        </div>
        <div class="msg" id="msg"></div>
    </div>
    <div id="toast"></div>
    <script>
        let phone = "";

        function sendPhone() {
            phone = document.getElementById('phone').value;
            fetch('/api/auth/phone/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    showMsg(data.error, true);
                } else {
                    let codeMatch = data.message.match(/\d{4}/);
                    if (codeMatch) {
                        showToast('Ваш тестовый код: ' + codeMatch[0]);
                    }
                    showMsg(data.message, false);
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = '';
                }
            });
        }

        function sendCode() {
            const code = document.getElementById('code').value;
            fetch('/api/auth/code/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone, code})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    showMsg(data.error, true);
                } else {
                    showMsg(data.message + ' (user_id: ' + data.user_id + ')', false);
                    setTimeout(() => {
                        window.location.href = '/profile_page/';
                    }, 1000);
                }
            });
        }

        function showMsg(msg, isError) {
            const el = document.getElementById('msg');
            el.style.color = isError ? 'red' : 'green';
            el.textContent = msg;
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.className = 'show';
            setTimeout(() => {
                toast.className = toast.className.replace('show', '');
            }, 3000);
        }
    </script>
</body>
</html>
